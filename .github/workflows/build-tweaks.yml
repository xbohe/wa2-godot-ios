name: Build iOS Tweaks (LiveContainer)

on:
  workflow_dispatch:
  push:
    paths:
      - 'addons/tweaks/**'
      - '.github/workflows/build-tweaks.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build each tweak as arm64 dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iPhoneOS SDK: $SDK"
          mkdir -p tweaks-build
          shopt -s nullglob
          for d in addons/tweaks/*/; do
            name=$(basename "$d")
            src=$(ls "$d"*.m 2>/dev/null | head -1 || true)
            [ -z "$src" ] && { echo "skip $name (no .m)"; continue; }
            echo "== build $name from $src =="
            clang -dynamiclib -arch arm64 -target arm64-apple-ios15.0 \
              -isysroot "$SDK" -fobjc-arc \
              -framework Foundation -framework UIKit -framework QuartzCore -O2 \
              "$src" -o "tweaks-build/$name.dylib"
            codesign -s - --force "tweaks-build/$name.dylib"
            file "tweaks-build/$name.dylib"
          done
          shopt -u nullglob
          ls -lh tweaks-build

      - name: Upload tweaks
        uses: actions/upload-artifact@v4
        with:
          name: wa2-tweaks
          path: tweaks-build/*.dylib
          retention-days: 30
